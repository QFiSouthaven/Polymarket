name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: poly-agent tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: poly-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (this also proves the ENDGAME §6 build order works)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run engine tests
        # Exit code 5 = "no tests collected". That is true today because
        # tests/test_risk_manager.py is a placeholder (ROADMAP blocker B-4), so it must not
        # mask real failures once the suite exists. Remove this shim when B-4 closes.
        run: |
          set +e
          python -m pytest tests -q
          code=$?
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then exit 0; fi
          exit "$code"

  mcp-tests:
    name: mcp-server tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run structure tests
        # Known-red today (ROADMAP blocker B-5): FastMCP.__init__ signature drift and a
        # hard-coded source path in project_state.scan_codebase_status(). The
        # continue-on-error flag exists only until B-5 closes — remove it then.
        continue-on-error: true
        run: python -m pytest tests -q

  secrets-guard:
    name: no secrets in the diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan changed files for committed credentials
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git diff --name-only "$base"...HEAD > files.txt || exit 0
          echo "Checking $(wc -l < files.txt) changed files."
          # .env and config.yaml are ignored; if one is force-added, fail the build.
          if grep -E '(^|/)\.env$|(^|/)config\.ya?ml$' files.txt > hit.txt; then
            echo "Committed secret-bearing file(s):"; cat hit.txt; exit 1
          fi
          # Obvious key shapes (private keys, long base64 secrets assigned to *_KEY/*_SECRET).
          if git diff -U0 "$base"...HEAD | grep -Eiq '^[[:space:]]*\+[[:space:]]*(-----BEGIN|[A-Z0-9_]*(PRIVATE_KEY|SECRET|TOKEN)[A-Z0-9_]*[[:space:]]*=[[:space:]]*[A-Za-z0-9+/]{32,})'; then
            echo "Possible credential literal in the diff."; exit 1
          fi
