[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "poly-agent"
version = "0.1.0"
description = "Autonomous PolyMarket trading agent — scans markets, finds edges, places bets, manages positions, auto-cashouts"
requires-python = ">=3.10"
dependencies = [
    "polymarket-us>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "websockets>=14",
    "pandas>=2.2",
    "numpy>=1.26",
    "rich>=13",
    "loguru>=0.7",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 120
target-version = "py310"
