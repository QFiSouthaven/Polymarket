[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poly-agent"
version = "0.2.0"
description = "Autonomous PolyMarket trading agent — scans markets, finds edges, places bets, manages positions, auto-cashouts"
requires-python = ">=3.10"
dependencies = [
    # SDK is on PyPI; latest release as of 2026-11-01 is 2.4.1. '>=0.2' admits the whole
    # 1.x/2.x line, so a fresh install can drift far from what this code was written against.
    # See Development/docs/ROADMAP.md blocker B-2 before tightening this pin.
    "polymarket-us>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "websockets>=14",
    "pandas>=2.2",
    "numpy>=1.26",
    "rich>=13",
    "loguru>=0.7",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
