# py-agent tests: pytest.ini
; run from the poly-agent root:
;   pytest tests/ -m strategy

[pytest]
# ── markers (registered here so --markers shows them) ───────────────────────
markers =
    strategy: integration tests that drive strategy engine (engine, strategies)
    risk:   risk_manager hard-limit tests (budget, stop_loss, kill_switch)
    exec:   executor.py error-handling tests (network, auth, order errors)
    decimal: Number Rule — Decimal-only money, no float leakage
    idempotent: idempotency-key correctness
    slow:   > 1 s fixtures or network-bound tests (skip by default)

# ── test discovery ────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── logging (live on the terminal) ───────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-5s %(name)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ── tmpdir: keep on failure so CI/artifacts can inspect ──────────────────────
addopts = --tb=short
; (tmpdir_retention is a plugin setting; here we use the built-in --basetemp
;  which defaults to .pytest_cache.  On failure pytest prints the path.)

# ── warnings ──────────────────────────────────────────────────────────────────
; P0: executor.py still uses `float` for price/size — warn but don't block dev
filterwarnings =
    error::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:The event loop is closed:RuntimeWarning

# ── default marker filter: skip slow / strategy-integration by default ────────
; run all:  pytest tests/ -m "not slow and not strategy"
; run risky: pytest tests/ -m risk
; run slow:  pytest tests/ -m slow
