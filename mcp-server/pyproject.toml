[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "polyagent-mcp-server"
version = "0.1.0"
description = "Persistent Memory MCP Server optimized for PolyAgent development lifecycle and Polymarket application integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "sqlite-utils>=3.35",
    "rich>=13.0",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mcp]
server = "mcp_server.server:main"
